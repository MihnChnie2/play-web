<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TỔ 1 NÈ - Circle Frame</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Arial', sans-serif;
        }

        #canvas-container {
            position: relative;
            width: 100vw;
            height: 100vh;
        }

        canvas {
            display: block;
        }

        /* Màn hình chào để kích hoạt nhạc */
        #start-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            cursor: pointer;
            color: #ff1493;
            transition: opacity 0.5s;
        }

        #start-overlay h2 {
            font-size: 24px;
            margin-bottom: 10px;
            text-shadow: 0 0 10px #ff1493;
        }

        #start-overlay p {
            font-size: 14px;
            color: #fff;
            opacity: 0.7;
        }

        /* Khung ảnh trung tâm - Trở lại hình tròn */
        #image-frame {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            width: 160px;
            height: 160px;
            border-radius: 50%;
            /* Hình tròn */
            overflow: hidden;
            border: 2px solid rgba(255, 20, 147, 0.4);
            box-shadow: 0 0 30px rgba(255, 20, 147, 0.5);
            z-index: 20;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.8s ease-in-out;
        }

        #image-frame.show {
            opacity: 1;
        }

        #image-frame img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: absolute;
            top: 0;
            left: 0;
            opacity: 0;
            transition: opacity 1.2s ease-in-out;
        }

        #image-frame img.active {
            opacity: 1;
        }

        /* Nút điều khiển nhạc */
        #music-control {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 100;
            background: rgba(255, 20, 147, 0.2);
            border: 1px solid rgba(255, 20, 147, 0.3);
            color: white;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(5px);
            transition: all 0.3s;
        }
    </style>
</head>

<body>

    <div id="start-overlay">
        <h2>Nhấn để bắt đầu ❤️</h2>
        <p>(Kích hoạt âm nhạc và hiệu ứng)</p>
    </div>

    <div id="canvas-container">
        <canvas id="heartCanvas"></canvas>
        <div id="image-frame"></div>
    </div>

    <audio id="bgMusic" loop>
        <source src="hen-lan-sau.mp3" type="audio/mpeg">
    </audio>
    <button id="music-control">⏸</button>

    <script>
        const canvas = document.getElementById('heartCanvas');
        const ctx = canvas.getContext('2d', { alpha: false });
        const imageFrame = document.getElementById('image-frame');
        const music = document.getElementById('bgMusic');
        const musicBtn = document.getElementById('music-control');
        const startOverlay = document.getElementById('start-overlay');

        let isStarted = false;

        startOverlay.addEventListener('click', () => {
            isStarted = true;
            startOverlay.style.opacity = '0';
            setTimeout(() => {
                startOverlay.style.display = 'none';
            }, 500);

            music.play().catch(e => console.log("Không thể tự động phát nhạc:", e));
        });

        musicBtn.addEventListener('click', () => {
            if (music.paused) {
                music.play();
                musicBtn.innerText = "⏸";
            } else {
                music.pause();
                musicBtn.innerText = "▶️";
            }
        });

        const images = [
            "to1.1.jpg",
            "to1.2.jpg",
            "to1.3.jpg",
            "to1.4.jpg",
        ];

        const floatingTexts = [
            "chúc toàn thể ae tổ 1 đậu NV1",
            "Thảo Nguyên",
            "Minh Thy",
            "Quỳnh Như",
            "Tuyết Hạnh",
            "Gia Long",
            "Thanh Hải",
            "Quốc Kha",
            "Quốc Đạt",
            "Phạm Bảo",
            " Minh Chiến",
            "Minh Trường",
            "Công Khanh",
            "ae tổ 1 mãi đỉnh nhé",
            "🥰🥰",
            "❤❤",
            "chúc toàn thể ae tổ 1 đậu NV1",
            "Thảo Nguyên",
            "Minh Thy",
            "Quỳnh Như",
            "Tuyết Hạnh",
            "Gia Long",
            "Thanh Hải",
            "Quốc Kha",
            "Quốc Đạt",
            "Phạm Bảo",
            " Minh Chiến",
            "Minh Trường",
            "Công Khanh",
            "ae tổ 1 mãi đỉnh nhé",
            "🥰🥰",
            "❤❤",
        ];
        let activeTexts = [];

        let currentImageIndex = 0;
        let appState = "DISPERSED";
        let stateTimer = 0;

        function initSlideshow() {
            images.forEach((src, index) => {
                const img = document.createElement('img');
                img.src = src;
                if (index === 0) img.classList.add('active');
                imageFrame.appendChild(img);
            });
        }

        function prepareNextImage() {
            const imgs = imageFrame.querySelectorAll('img');
            if (imgs.length === 0) return;
            imgs[currentImageIndex].classList.remove('active');
            currentImageIndex = (currentImageIndex + 1) % imgs.length;
            imgs[currentImageIndex].classList.add('active');
        }

        function startDisperse() {
            appState = "DISPERSED";
            stateTimer = 0;
            imageFrame.classList.remove('show');
            particles.forEach(p => p.setOffScreenTarget());
        }

        function startConverge() {
            appState = "CONVERGING";
            stateTimer = 0;
            particles.forEach(p => p.setHeartTarget());
        }

        class FloatingText {
            constructor() { this.reset(); }
            reset() {
                this.text = floatingTexts[Math.floor(Math.random() * floatingTexts.length)];
                this.x = Math.random() * window.innerWidth;
                this.y = window.innerHeight + 50;
                this.speed = Math.random() * 0.8 + 0.4;
                this.opacity = 0;
                this.fontSize = Math.random() * 12 + 14;
                this.maxOpacity = Math.random() * 0.3 + 0.1;
            }
            update() {
                this.y -= this.speed;
                if (this.y < window.innerHeight * 0.7) {
                    this.opacity -= 0.002;
                } else {
                    this.opacity = Math.min(this.opacity + 0.01, this.maxOpacity);
                }
                if (this.y < -50 || this.opacity <= 0) this.reset();
            }
            draw() {
                ctx.font = `${this.fontSize}px Arial`;
                ctx.fillStyle = `rgba(255, 105, 180, ${this.opacity})`;
                ctx.fillText(this.text, this.x, this.y);
            }
        }

        let particles = [];
        const particleCount = 20000;
        let width, height;

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            createParticles();
            activeTexts = Array.from({ length: 15 }, () => new FloatingText());
        }

        window.addEventListener('resize', resize);

        function getHeartPoint(t) {
            let x = 16 * Math.pow(Math.sin(t), 3);
            let y = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));
            return { x, y };
        }

        function randomGaussian() {
            let u = 0, v = 0;
            while (u === 0) u = Math.random();
            while (v === 0) v = Math.random();
            return Math.sqrt(-2.0 * Math.log(u)) * Math.cos(2.0 * Math.PI * v);
        }

        class Particle {
            constructor() {
                this.x = Math.random() * window.innerWidth;
                this.y = Math.random() * window.innerHeight;
                this.size = Math.random() * 1.8 + 0.2;
                this.opacity = Math.random() * 0.5 + 0.1;
                this.vibrantSeed = Math.random() * 100;
                this.setOffScreenTarget();
            }

            setOffScreenTarget() {
                const side = Math.floor(Math.random() * 4);
                const padding = 500;
                switch (side) {
                    case 0: this.targetX = Math.random() * window.innerWidth; this.targetY = -padding; break;
                    case 1: this.targetX = window.innerWidth + padding; this.targetY = Math.random() * window.innerHeight; break;
                    case 2: this.targetX = Math.random() * window.innerWidth; this.targetY = window.innerHeight + padding; break;
                    case 3: this.targetX = -padding; this.targetY = Math.random() * window.innerHeight; break;
                }
                this.speed = Math.random() * 0.03 + 0.01;
            }

            setHeartTarget() {
                const t = Math.random() * Math.PI * 2;
                const point = getHeartPoint(t);
                const scale = Math.min(window.innerWidth, window.innerHeight) / 38;
                let inwardSpread = Math.pow(Math.random(), 3);
                let r = 1 - inwardSpread * 0.3;
                this.distFromCenter = r;
                this.elasticity = 0.8 + r * 0.5;
                this.targetX = window.innerWidth / 2 + point.x * scale * r + randomGaussian() * 3;
                this.targetY = window.innerHeight / 2 + point.y * scale * r + randomGaussian() * 3;
                this.speed = Math.random() * 0.05 + 0.02;
            }

            update(tick) {
                this.x += (this.targetX - this.x) * this.speed;
                this.y += (this.targetY - this.y) * this.speed;
                this.curX = this.x + Math.sin(tick * 0.15 + this.vibrantSeed) * 1.5;
                this.curY = this.y + Math.cos(tick * 0.15 + this.vibrantSeed) * 1.5;
            }

            draw(beatFactor) {
                let drawX = this.curX;
                let drawY = this.curY;
                if (appState === "HEART") {
                    let dx = this.curX - window.innerWidth / 2;
                    let dy = this.curY - window.innerHeight / 2;
                    let pulseStrength = 1 + (beatFactor - 1) * this.elasticity;
                    drawX = window.innerWidth / 2 + dx * pulseStrength;
                    drawY = window.innerHeight / 2 + dy * pulseStrength;
                }
                ctx.fillStyle = `rgba(255, 30, 120, ${this.opacity})`;
                ctx.fillRect(drawX, drawY, this.size, this.size);
            }
        }

        function createParticles() {
            particles = [];
            for (let i = 0; i < particleCount; i++) {
                particles.push(new Particle());
            }
        }

        let tick = 0;
        function animate() {
            if (!isStarted) {
                requestAnimationFrame(animate);
                return;
            }

            tick++;
            stateTimer++;

            if (appState === "DISPERSED" && stateTimer > 150) {
                startConverge();
            } else if (appState === "CONVERGING" && stateTimer > 120) {
                appState = "HEART";
                stateTimer = 0;
                imageFrame.classList.add('show');
            } else if (appState === "HEART" && stateTimer > 450) {
                prepareNextImage();
                startDisperse();
            }

            let beatFactor = 1;
            if (appState === "HEART") {
                let pulse = Math.pow(Math.abs(Math.sin(tick * 0.07)), 20) * 0.22;
                beatFactor = 1 + pulse;
                imageFrame.style.transform = `translate(-50%, -50%) scale(${beatFactor})`;
            } else {
                imageFrame.style.transform = `translate(-50%, -50%) scale(0)`;
            }

            ctx.globalCompositeOperation = 'source-over';
            ctx.fillStyle = 'rgba(0, 0, 0, 0.25)';
            ctx.fillRect(0, 0, width, height);

            activeTexts.forEach(t => {
                t.update();
                t.draw();
            });

            ctx.globalCompositeOperation = 'lighter';
            for (let i = 0; i < particles.length; i++) {
                particles[i].update(tick);
                particles[i].draw(beatFactor);
            }

            requestAnimationFrame(animate);
        }

        window.onload = () => {
            resize();
            initSlideshow();
            animate();
        };
    </script>
</body>

</html>
